<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>課題一覧　｜　課題管理アプリケーション</title>
</head>
<body>
<h1>課題一覧</h1>
<a th:href="@{/}">トップページ</a>
<a th:href="@{/issues/creationForm}">作成画面</a>
<table>
    <thead>
    <tr>
        <th>#</th>
        <th>概要</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="issue : ${issueList}">
        <th>
            <a th:href="@{/issues/{id}(id=${issue.id})}" th:text="${issue.id}"></a>
        </th>
        <td>
            <a th:href="@{/issues/{id}(id=${issue.id})}" th:text="${issue.summary}"></a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
