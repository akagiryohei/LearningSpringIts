<!DOCTYPE html>
<html th:replace="~{fragment/layout :: layout(~{::title}, ~{::body})}">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>課題一覧　｜　課題管理アプリケーション</title>
</head>
<body>
<h1 class="mt-3">課題作成</h1>
<form th:action="@{/issues}" th:method="post" th:object="${issueForm}">
    <div class="mt-3">
        <label for="summaryInput" class="form-label">概要</label>
        <input type="text" id="summaryInput" th:field="*{summary}" class="form-control"
        th:classappend="${#fields.hasErrors('summary')} ? 'is-invalid' : ''">
        <p class="invalid-feedback" th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}"></p>
    </div>
    <div class="mt-3">
        <label for="descriptionInput" class="form-label">説明</label>
        <textarea type="text" id="descriptionInput" th:field="*{description}" row="10" class="form-control"
        th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"></textarea>
        <p class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
    </div>
    <button type="submit" class="mt-3 btn btn-primary">作成</button>
    <a th:href="@{/issues}" class="mt-3 btn btn-danger">キャンセル</a>
</form>
</body>
</html>
